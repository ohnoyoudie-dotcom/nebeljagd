name: Dense meadow and gameplay checks
on:
  push:
    branches: ['feature/rei-grass-ground']
    paths: ['tools/upgrade_meadow_v2.py', 'tools/test_meadow_v2.py', '.github/workflows/meadow-v2-check.yml']
permissions:
  contents: write
concurrency:
  group: meadow-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/rei-grass-ground'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            welt
            Welt und Editor
            tools
            Blender/Gras/textures
            Blender/nebeljagd_umwelt_kit_v1/assets
      - name: Prepare browser tests
        run: |
          python -m pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
      - name: Apply guarded upgrade and build
        run: |
          python tools/upgrade_meadow_v2.py
          python tools/grass-ground/build.py
          node --check grass-build/map-editor.html.mjs
          node --check grass-build/nebeljagd.html.mjs
      - name: Test editor, grass, collisions, opening chests and vision
        run: python tools/test_meadow_v2.py
      - name: Publish verified files on development branch only
        run: |
          test "$GITHUB_REF" = refs/heads/feature/rei-grass-ground
          cp grass-build/map-editor.html welt/map-editor.html
          cp grass-build/nebeljagd.html welt/nebeljagd.html
          cp grass-build/nebeljagd.html welt/index.html
          cp grass-build/map-editor.html 'Welt und Editor/map-editor.html'
          cp grass-build/nebeljagd.html 'Welt und Editor/nebeljagd.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/grass-ground welt/map-editor.html welt/nebeljagd.html welt/index.html 'Welt und Editor/map-editor.html' 'Welt und Editor/nebeljagd.html'
          git diff --cached --quiet || git commit -m 'fix: dense animated meadow, solid crates and actors, soft charcoal vision'
          git push origin HEAD:feature/rei-grass-ground
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meadow-v2-verified
          path: |
            grass-build/*.html
            grass-test-v2
            tools/grass-ground
            tools/test_meadow_v2.py
            Blender/nebeljagd_umwelt_kit_v1/assets/crate_wood.glb
          retention-days: 3
