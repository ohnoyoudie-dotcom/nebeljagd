name: Inspect tavern editor
on:
  push:
    paths:
      - '.github/workflows/inspect-tavern-editor.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read editor sources
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, urllib.request
          out = pathlib.Path('editor-sources')
          out.mkdir()
          paths = ['welt/map-editor.html', 'welt/index.html', 'Welt und Editor/map-editor.html', 'Welt und Editor/index.html']
          for index, path in enumerate(paths):
              url = 'https://api.github.com/repos/' + os.environ['REPO'] + '/contents/' + urllib.parse.quote(path) + '?ref=' + os.environ['REF']
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
              text = base64.b64decode(data['content']).decode('utf-8')
              (out / (str(index) + '.html')).write_text(text, encoding='utf-8')
              print('\nFILE', path, 'SHA', data['sha'], 'SIZE', len(text))
              compact = re.sub(r'data:[^\s\x22\x27\x60]*;base64,[A-Za-z0-9+/=]+', '[EMBEDDED ASSET]', text)
              for pattern in ['Taverne', 'taverne', 'Blender', '.glb', 'variants:', 'house:']:
                  matches = list(re.finditer(re.escape(pattern), compact))
                  print('PATTERN', pattern, 'COUNT', len(matches))
                  for match in matches[:12]:
                      print(compact[max(0, match.start()-300):match.end()+600])
          (out / 'paths.json').write_text(json.dumps(paths), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: editor-sources
          path: editor-sources
          retention-days: 1
