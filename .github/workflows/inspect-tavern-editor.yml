name: Register uploaded taverns
on:
  push:
    paths:
      - '.github/workflows/inspect-tavern-editor.yml'
permissions:
  contents: write
concurrency:
  group: register-uploaded-taverns
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate models and update shipped bundles atomically
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, struct, subprocess, urllib.request
          root = pathlib.Path('tavern-validation')
          root.mkdir()
          base = 'https://api.github.com/repos/' + os.environ['REPO']
          def api(endpoint, payload=None, method=None):
              raw = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + endpoint, data=raw, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          ref = os.environ['REF']
          assert api('/git/ref/heads/main')['object']['sha'] == ref, 'Branch changed; refusing to overwrite newer work'
          tree = api('/git/trees/' + ref + '?recursive=1')
          assert not tree.get('truncated'), 'Incomplete repository tree'
          entries = {item['path']: item for item in tree['tree'] if item['type'] == 'blob'}
          bundles = ['welt/map-editor.html', 'welt/index.html', 'welt/nebeljagd.html', 'Welt und Editor/map-editor.html', 'Welt und Editor/nebeljagd.html']
          models = ['Blender/Taverne.glb', 'Blender/taverne_nebeljagd.glb']
          paths = bundles + models + ['tools/register_taverns.py']
          original = {}
          report = {'base_commit': ref, 'models': [], 'bundles': []}
          for path in paths:
              item = entries[path]
              blob = api('/git/blobs/' + item['sha'])
              assert blob['encoding'] == 'base64', 'Unexpected blob encoding'
              raw = base64.b64decode(blob['content'])
              assert len(raw) == item['size'], 'Incomplete file: ' + path
              digest = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert digest == item['sha'], 'Blob integrity failed: ' + path
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              if path in bundles:
                  original[path] = raw
              if path in models:
                  magic, version, size = struct.unpack_from('<4sII', raw)
                  assert magic == b'glTF' and version == 2 and size == len(raw), 'Invalid GLB: ' + path
                  length, kind = struct.unpack_from('<II', raw, 12)
                  assert kind == 0x4e4f534a, 'Missing GLB JSON chunk'
                  doc = json.loads(raw[20:20+length])
                  assert doc.get('meshes'), 'GLB contains no meshes'
                  external = [entry['uri'] for key in ('images','buffers') for entry in doc.get(key, []) if entry.get('uri') and not entry['uri'].startswith('data:')]
                  assert not external, 'GLB requires missing external resources: ' + repr(external)
                  info = {'path': path, 'sha': item['sha'], 'bytes': len(raw), 'meshes': len(doc['meshes']), 'materials': len(doc.get('materials', [])), 'textures': len(doc.get('textures', [])), 'extensionsRequired': doc.get('extensionsRequired', []), 'sample_nodes': [node.get('name', '') for node in doc.get('nodes', [])[:12]]}
                  report['models'].append(info)
                  print('VALID MODEL', json.dumps(info, ensure_ascii=False))
          subprocess.run(['python3', str(root / 'tools/register_taverns.py'), '--root', str(root), '--write'], check=True)
          subprocess.run(['python3', str(root / 'tools/register_taverns.py'), '--root', str(root)], check=True)
          changed = []
          for path in bundles:
              raw = (root / path).read_bytes()
              if raw == original[path]:
                  continue
              blob = api('/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}, 'POST')
              changed.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              report['bundles'].append({'path': path, 'sha': blob['sha'], 'bytes': len(raw)})
          assert len(changed) == 5, 'Expected all five shipped bundles to change'
          assert api('/git/ref/heads/main')['object']['sha'] == ref, 'Branch changed during validation'
          new_tree = api('/git/trees', {'base_tree': tree['sha'], 'tree': changed}, 'POST')
          commit = api('/git/commits', {'message': 'fix: expose both uploaded taverns in editors and load their distinct GLBs', 'tree': new_tree['sha'], 'parents': [ref]}, 'POST')
          api('/git/refs/heads/main', {'sha': commit['sha'], 'force': False}, 'PATCH')
          report['commit'] = commit['sha']
          report['checks'] = ['both GLBs valid and self-contained', 'five inline JavaScript bundles syntax-checked', 'two distinct model IDs in every catalog', 'patch is idempotent', 'atomic non-force publication']
          (root / 'validation.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          print('PUBLISHED COMMIT', commit['sha'])
          print('UPDATED', ', '.join(bundles))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tavern-validation
          path: tavern-validation
          retention-days: 1
