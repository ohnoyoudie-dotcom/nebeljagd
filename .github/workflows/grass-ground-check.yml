name: Terrain grass validation
on:
  push:
    branches: ['feature/rei-grass-ground']
    paths: ['.github/workflows/grass-ground-check.yml', 'tools/grass-ground/**']
permissions:
  contents: read
concurrency:
  group: terrain-grass-validation
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rei-grass-ground
          sparse-checkout: |
            welt
            Blender/Gras/textures
            tools/grass-ground
      - name: Install test dependencies
        run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Build standalone editor and game
        run: |
          python tools/grass-ground/build.py
          node --check grass-build/map-editor.html.mjs
          node --check grass-build/nebeljagd.html.mjs
      - name: Browser integration test
        run: python tools/grass-ground/test_browser.py
      # Historical patch experiments remain downloadable artifacts only.
      # The current portal/editor are built together by work-build-check.yml.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grass-editor-tested
          path: |
            grass-build/*.html
            grass-test
            tools/grass-ground
          retention-days: 3
