name: Work build and visual checks
on:
  workflow_dispatch:
  push:
    branches: ['work']
permissions:
  contents: write
concurrency:
  group: nebeljagd-work-build
  cancel-in-progress: true
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/work'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Integrate reviewed tree placement without modifying models or map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f scripts/integrate-tree-placement.js ]; then
            node scripts/integrate-tree-placement.js
            node --check src/map/objects.js
            node --check src/map/retired-scenery.js
            git add -- src/map/objects.js src/map/retired-scenery.js src/map/editor.js src/map/landscape-panel.js tests/scenery_authoring.test.js tests/tripo_palette_smoke.py
            git rm -- scripts/integrate-tree-placement.js
            git commit -m 'feat(editor): enable four existing GLB trees for individual and brush placement'
          fi
      - name: Install, run full tests and verify assets
        run: |
          npm ci
          # Verify the unchanged regular publication contract, not this one-time runner.
          git show f24155074941ccdbc89d95c7ec73085e98fd6ac9:.github/workflows/work-build-check.yml > .github/workflows/work-build-check.yml
          npm test
          npm run verify:assets
          git restore -- .github/workflows/work-build-check.yml
      - name: Build actual editor and game into welt
        run: npm run build
      - name: Install browser smoke dependencies
        run: |
          python -m pip install --quiet playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify actual editor placement and 3D tree instances
        run: |
          python -m http.server 4175 --bind 127.0.0.1 >/tmp/tree-editor-preview.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4175/welt/map-editor.html >/dev/null && break
            sleep 1
          done
          python tests/tree_placement_smoke.py
          python tests/placement_rotation_smoke.py
      - name: Publish verified source and generated files to work only
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if [ "$(git ls-remote origin refs/heads/work | cut -f1)" != "$SOURCE_COMMIT" ]; then
            echo 'work advanced; refusing to overwrite newer changes.' >&2
            exit 1
          fi
          git diff --exit-code "$SOURCE_COMMIT" -- worldmap.json assets/inbox Blender
          git add -- welt
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish verified tree placement editor and game'
          fi
          git push origin HEAD:work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-placement-check
          path: |
            test-results/tree-placement/result.json
            test-results/tree-placement/trees-in-editor.png
            test-results/tree-placement/trees-in-game.png
            test-results/placement-rotation/result.json
          retention-days: 7
