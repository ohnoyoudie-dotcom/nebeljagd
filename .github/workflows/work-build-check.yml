name: Work build and visual checks
on:
  push:
    branches: ['work']
    paths:
      - 'src/**'
      - 'assets/characters/**'
      - 'assets/imported/**'
      - 'assets/catalog/**'
      - 'avatar-preview.html'
      - 'index.html'
      - 'teacher.html'
      - 'lobby.html'
      - 'game.html'
      - 'map-editor.html'
      - 'server/**'
      - 'tests/**'
      - 'scripts/**'
      - 'worldmap.json'
      - 'worldmap.schema.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'render.yaml'
      - '.github/workflows/work-build-check.yml'
permissions:
  contents: write
concurrency:
  group: nebeljagd-work-build
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and run unit tests
        run: |
          npm ci
          npm test
          npm run verify:assets
      - name: Build standalone editor and game
        run: npm run build
      - name: Install browser smoke dependencies
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Verify meadow, vision and shadow runtime
        run: |
          npm run preview -- --port 4174 >/tmp/nebeljagd-preview.log 2>&1 &
          echo $! >/tmp/nebeljagd-preview.pid
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4174/nebeljagd.html >/dev/null && break
            sleep 1
          done
          python tests/work_meadow_vision_smoke.py
          python tests/avatar_smoke.py
          python tests/avatar_preview_smoke.py
      - name: Verify classroom login, practice lobby and current editor
        run: python tests/classroom_smoke.py
      - name: Publish verified build to welt
        run: |
          # npm run build already synchronizes the complete portal and editor.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add welt
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish verified work editor and game'
            git push origin HEAD:work
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-meadow-vision-check
          path: |
            work-smoke
            docs/avatar-check-*
            test-results/avatar-preview
            test-results/classroom
            assets/characters/adventurer-inspection.json
            /tmp/nebeljagd-preview.log
          retention-days: 3
