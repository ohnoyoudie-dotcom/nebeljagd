# Work-only integration build. The integration helper restores the original
# workflow in the verified source commit; this run never publishes to main.
name: Work build and visual checks
on:
  workflow_dispatch:
  push:
    branches: ['work']
permissions:
  contents: write
concurrency:
  group: nebeljagd-work-build
  cancel-in-progress: true
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/work'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Integrate the reviewed editor change
        run: |
          node scripts/integrate-placement-rotation.js
          node --check src/map/editor.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/map/editor.js .github/workflows/work-build-check.yml
          git rm -- scripts/integrate-placement-rotation.js
          git commit -m 'feat(editor): connect per-object random placement rotation'
      - name: Install and run unit tests
        run: |
          npm ci
          npm test
          npm run verify:assets
      - name: Build standalone editor and game
        run: npm run build
      - name: Install browser smoke dependencies
        run: |
          python -m pip install --quiet playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify generated editor and exported offline editor
        run: |
          python -m http.server 4175 --bind 127.0.0.1 >/tmp/rotation-preview.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4175/welt/map-editor.html >/dev/null && break
            sleep 1
          done
          python tests/placement_rotation_smoke.py
      - name: Publish verified code and generated files to work only
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if [ "$(git ls-remote origin refs/heads/work | cut -f1)" != "$SOURCE_COMMIT" ]; then
            echo 'work advanced during verification; refusing to overwrite newer changes.' >&2
            exit 1
          fi
          git add -- welt
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish verified placement rotation editor and game'
          fi
          git push origin HEAD:work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: placement-rotation-check
          path: |
            test-results/placement-rotation/rotation-editor.png
            test-results/placement-rotation/result.json
            /tmp/rotation-preview.log
          retention-days: 7
