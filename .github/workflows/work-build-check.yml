name: Work build and visual checks
on:
  workflow_dispatch:
  push:
    branches: ['work']
    # Every newer work commit needs a successor run, including docs-only edits.
    # Otherwise the strict freshness guard could abort a release with no newer
    # run to replace it. Token-authored build commits do not trigger themselves.
permissions:
  contents: write
  pages: write
concurrency:
  group: nebeljagd-work-build
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/work'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Test this triggering source, not a newer moving work tip.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install corrected user tree with embedded leaf alpha texture
        run: |
          set -euo pipefail
          MODEL=assets/imported/user-trees/runtime/tree1.glb
          SHA=c8c125554459d89352f23a1d9377899b145617fd589abe36cdbf7d228820c92c
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -f "$MODEL" ] || [ "$(sha256sum "$MODEL" | cut -d' ' -f1)" != "$SHA" ]; then
            # Verified artist asset, reconstructed from the owner's packed
            # Blender leaf mask. Replace only this single GLB, never worldmap.
            curl --fail --location --retry 4 --retry-delay 2 --max-time 90 \
              'https://d2ol7oe51mr4n9.cloudfront.net/user_3LFTEwt5x5adTPmiXDny0NDloGO/bc9c2f53-9993-41bf-95a1-88163d47d7f3.glb' --output "$MODEL.tmp"
            printf '%s  %s\n' "$SHA" "$MODEL.tmp" | sha256sum --check
            mv "$MODEL.tmp" "$MODEL"
          fi
          printf '%s  %s\n' "$SHA" "$MODEL" | sha256sum --check
          echo "Tree1 leaf-mask GLB validated: $(wc -c < "$MODEL") bytes"
      - name: Install and run unit tests
        run: |
          npm ci
          npm test
          npm run verify:assets
      - name: Build standalone editor and game
        run: npm run build
      - name: Install browser smoke dependencies
        run: |
          python -m pip install --quiet playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Start the generated browser preview
        run: |
          npm run preview -- --port 4174 >/tmp/nebeljagd-preview.log 2>&1 &
          echo $! >/tmp/nebeljagd-preview.pid
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4174/nebeljagd.html >/dev/null && break
            sleep 1
          done
      - name: Verify uploaded weapon models, pickup, swaps and attacks
        # Full graphical regression is available on manual dispatch. Ordinary
        # editor pushes still run all unit/asset/build and focused browser checks.
        if: github.event_name == 'workflow_dispatch'
        env:
          NEBELJAGD_URL: http://127.0.0.1:4174
          NEBELJAGD_QA_OUT: test-results/tripo-weapons
          NEBELJAGD_BUNDLED_CHROMIUM: '1'
        run: python tests/tripo_weapon_editor_smoke.py
      - name: Verify uploaded fireball, shader, sparks and smoke
        # Full graphical regression is available on manual dispatch. Ordinary
        # editor pushes still run all unit/asset/build and focused browser checks.
        if: github.event_name == 'workflow_dispatch'
        env:
          NEBELJAGD_URL: http://127.0.0.1:4174
        run: python tests/fireball_browser_smoke.py
      - name: Verify imported projectiles, artillery arc and see-over props
        if: github.event_name == 'workflow_dispatch'
        env:
          NEBELJAGD_URL: http://127.0.0.1:4174
        run: python tests/projectiles_sight_smoke.py
      - name: Verify targeted hold, release and return controls
        # Full graphical regression is available on manual dispatch. Ordinary
        # editor pushes still run all unit/asset/build and focused browser checks.
        if: github.event_name == 'workflow_dispatch'
        run: python tests/special_weapon_controls_smoke.py
      - name: Verify meadow, vision and shadow runtime
        # Full graphical regression is available on manual dispatch. Ordinary
        # editor pushes still run all unit/asset/build and focused browser checks.
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tests/work_meadow_vision_smoke.py
          python tests/avatar_smoke.py
          python tests/avatar_preview_smoke.py
      - name: Verify classroom login, practice lobby and current editor
        # Classroom end-to-end game simulation is verified on explicit full runs;
        # editor pushes instead run the dedicated online editor and tree checks.
        if: github.event_name == 'workflow_dispatch'
        run: python tests/classroom_smoke.py
      - name: Verify current editor entry, project map and preserved drafts
        run: python tests/online_editor_smoke.py
      - name: Verify online map saving, conflict protection and credential-free exports
        run: python tests/github_map_sync_smoke.py
      - name: Verify removed tree palette and preserved saved GLB trees in editor and game
        run: |
          python -m http.server 4175 --bind 127.0.0.1 >/tmp/nebeljagd-tree.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4175/welt/map-editor.html >/dev/null && break
            sleep 1
          done
          python tests/tree_placement_smoke.py
      - name: Publish verified build to welt
        id: save-work
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          # Refuse stale runs instead of overwriting a newer source change.
          git fetch --depth=1 origin work
          if [ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_COMMIT" ]; then
            echo 'work advanced while this build ran; the newer run must publish.' >&2
            exit 1
          fi
          # npm run build already synchronizes the complete portal and editor.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Publish the exact verified binary alongside the matching browser build.
          git add welt assets/imported/user-trees/runtime/tree1.glb
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish verified work editor and game'
            git push origin HEAD:work
          fi
          echo "work_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Read the current public site without replacing its other paths
        uses: actions/checkout@v4
        with:
          ref: main
          path: .pages-site
      - name: Prepare matched editor, map and game for the public preview
        run: node scripts/prepare-preview.js welt .pages-site/preview
      - name: Publish verified preview to main
        id: save-preview
        env:
          EXPECTED_WORK_COMMIT: ${{ steps.save-work.outputs.work_commit }}
        run: |
          if [ "$(git ls-remote origin refs/heads/work | cut -f1)" != "$EXPECTED_WORK_COMMIT" ]; then
            echo 'A newer work source is available; refusing this stale publication.' >&2
            exit 1
          fi
          git -C .pages-site config user.name 'github-actions[bot]'
          git -C .pages-site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .pages-site add -- preview
          if ! git -C .pages-site diff --cached --quiet; then
            git -C .pages-site commit -m 'build: publish matched current editor and project map'
            # A concurrent main change makes this fail safely; never force-push.
            git -C .pages-site push origin HEAD:main
          fi
          echo "commit=$(git -C .pages-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Request Pages publication and verify the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_COMMIT: ${{ steps.save-preview.outputs.commit }}
        # Token-authored pushes do not trigger the normal automatic Pages build.
        # Use the existing branch-Pages API explicitly; never change site config.
        run: node scripts/request-pages-build.js
      - name: Upload the verified work browser package
        uses: actions/upload-artifact@v4
        with:
          name: nebeljagd-work-browser
          path: |
            welt/nebeljagd-welt-und-editor.zip
            welt/release.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-meadow-vision-check
          path: |
            work-smoke
            docs/avatar-check-*
            test-results/avatar-preview
            test-results/classroom
            test-results/online-editor
            test-results/github-map-sync
            test-results/tripo-weapons
            test-results/fireball
            assets/characters/adventurer-inspection.json
            /tmp/nebeljagd-preview.log
          retention-days: 3
