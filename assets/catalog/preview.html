<!doctype html><html lang="de"><meta charset="utf-8"><title>Nebeljagd Asset-Vorschauen</title><style>body{margin:0;background:#d9dfd7}canvas{display:block}</style><body><script type="module">
import * as THREE from 'three';
import { OBJECT_CATALOG, makeWorldObject } from '../../src/map/objects.js';
import { createWorldObjectRenderer } from '../../src/world-object-renderer.js';
import { createWeapons } from '../../src/weapons.js';
import { createChests } from '../../src/chests.js';
import { loadTripoChest } from '../../src/tripo-chest.js';
import { createPickups } from '../../src/pickups.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9dfd7');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(256,192);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight('#eef6ff','#808566',2.4));const sun=new THREE.DirectionalLight('#fff3d7',3);sun.position.set(30,40,30);scene.add(sun);
const definitions=OBJECT_CATALOG.flatMap(item=>item.variants.map(variant=>({kind:item.kind,variant:variant.id,label:variant.label})));
const objects=definitions.map((item,index)=>makeWorldObject(item.kind,[index*80,0],{id:`preview-${item.kind}-${item.variant}`,variant:item.variant,name:item.label,rarity:'common'}));
const root=new THREE.Group();scene.add(root);const scenery=await createWorldObjectRenderer(root,{map:{objects},heightAt:()=>0,groundHeightAt:()=>0,quality:'high'});
const actor=new THREE.Group();root.add(actor);const world={heightAt:()=>0,bounds:5000,traceProjectile:()=>null};
const weapons=createWeapons(root,actor,world,null,{placements:objects,heightAt:()=>0});
const chests=createChests(root,{placements:objects,heightAt:()=>0,tripoPrototype:await loadTripoChest(objects)});const pickups=createPickups(root,{placements:objects,heightAt:()=>0});
const plane=new THREE.Mesh(new THREE.CircleGeometry(1,64),new THREE.MeshStandardMaterial({color:'#aebba3',roughness:1}));plane.rotation.x=-Math.PI/2;plane.position.y=-.025;root.add(plane);
const camera=new THREE.OrthographicCamera(-8,8,6,-6,.01,500);const focus=new THREE.Vector3();let time=5;
window.previewVariants=definitions;
window.captureVariant=(kind,variant)=>{
 const index=definitions.findIndex(item=>item.kind===kind&&item.variant===variant);if(index<0)throw Error('Unknown variant');
 const x=index*80;const spans={tree:10,house:23,flower:4.6,grass:9,rock:4.3,bush:3.3,ruin:16,mound:17,wall:4.7,fence:4.7,crate:2.1,wagon:4.3,barrel:2.1,well:3.8,shrine:4.8,heart:2.7,chest:3,bow:2.5,sword:2.5,fireStaff:3,iceStaff:3};
 const kitFraming={'kit-pine-high':[6.7,1.8],'kit-pine-young':[5,1.25],'kit-oak-green':[7.2,1.8],'kit-oak-autumn':[7.2,1.8],'kit-timber':[7,.9],'kit-tall':[8,.8],'kit-cluster':[3.5,.35],'kit-single':[3.2,.35],'kit-arch':[5.5,.8],'kit-stone':[4.7,.5],'kit-wood':[kind==='crate'?2.1:4.7,kind==='crate'?.3:.55]};
 const framing=kitFraming[variant];let span=framing?.[0]??spans[kind];
 const point=new THREE.Vector3(x,0,0);time+=1;scenery.update(0,time,point);weapons.update(0,time,point);chests.update(0,time,point);pickups.update(0,time,new THREE.Vector3(-99999,0,0),{viewerPosition:point,canCollect:false});
 // All variants share this inspection scene. A large castle's wider camera
 // can otherwise include the next prop 80m away in a thumbnail corner.
 // Isolate actual meshes for this capture, then restore their visibility.
 const hiddenMeshes=[],isolationBounds=new THREE.Box3(),isolationCentre=new THREE.Vector3();root.updateMatrixWorld(true);
 root.traverseVisible(part=>{if(!part.isMesh||part===plane)return;isolationBounds.setFromObject(part);if(isolationBounds.isEmpty())return;isolationBounds.getCenter(isolationCentre);if(Math.abs(isolationCentre.x-x)>=40||Math.abs(isolationCentre.z)>=40){hiddenMeshes.push(part);part.visible=false;}});
 try {
 const heights={tree:2.8,house:1.3,flower:.3,grass:.6,rock:.8,bush:.45,ruin:1,mound:1.1,wall:.5,fence:.55,crate:.3,wagon:.5,barrel:.45,well:1.1,shrine:1.1,heart:.55,chest:.45,bow:.6,sword:.6,fireStaff:.65,iceStaff:.65};
 focus.set(x,framing?.[1]??heights[kind],0);
 window.lastPreviewBounds=null;
 if(variant.startsWith('kit-')){
  const bounds=new THREE.Box3(),partBounds=new THREE.Box3(),centre=new THREE.Vector3();root.updateMatrixWorld(true);
  root.traverseVisible(part=>{if(!part.isMesh||part===plane)return;partBounds.setFromObject(part);if(partBounds.isEmpty())return;partBounds.getCenter(centre);if(Math.abs(centre.x-x)<40&&Math.abs(centre.z)<40)bounds.union(partBounds);});
  if(bounds.isEmpty()||bounds.max.y-bounds.min.y<.15)throw Error(`No actual runtime geometry for ${kind}:${variant}`);
  const size=bounds.getSize(new THREE.Vector3());bounds.getCenter(focus);span=Math.max(2,size.length()*1.12);window.lastPreviewBounds={min:bounds.min.toArray(),max:bounds.max.toArray(),span};
 }
 camera.left=-span*2/3;camera.right=span*2/3;camera.top=span/2;camera.bottom=-span/2;camera.updateProjectionMatrix();
 camera.position.copy(focus).add(new THREE.Vector3(span*.70,span*.95,span*1.05));camera.lookAt(focus);
 plane.position.set(x,-.025,0);plane.scale.setScalar(framing?span*.38:kind==='house'?11:kind==='ruin'?7:span*.38);
 renderer.render(scene,camera);return renderer.domElement.toDataURL('image/webp',.88);
 } finally { for(const mesh of hiddenMeshes)mesh.visible=true; }
};
window.previewReady=true;
</script></body></html>
