<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Nebeljagd · Architekturstudie</title><style>html,body{margin:0;background:#29362d;color:#e9e1ca;font:14px system-ui}canvas{display:block}aside{position:fixed;left:24px;bottom:20px;background:#172c28dd;padding:14px 18px;border:1px solid #b6a77a66;border-radius:5px;pointer-events:none}strong{font-family:Georgia;font-size:20px;display:block;margin-bottom:5px}</style></head><body><aside><strong>Nebeljagd · Walddorf</strong>Eigenständige Architekturstudie · Kräuterhaus / Waldgasthaus / Jägerhaus</aside><script type="module">
import * as THREE from 'three';
import {createHouses} from '../../src/houses.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.10;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#647a70');scene.add(new THREE.HemisphereLight('#e7e4c9','#536551',1.8));const sun=new THREE.DirectionalLight('#ffe3b0',3.0);sun.position.set(-25,50,24);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-48,right:48,top:48,bottom:-48,near:1,far:110});sun.shadow.normalBias=.03;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:'#788064',roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const {houses}=createHouses(scene,[{name:'Mooswinkel',x:-19,z:0},{name:'Mondhain',x:0,z:0},{name:'Wildheide',x:19,z:0}]);
if(location.search.includes('inside'))for(const h of houses){h.roof.visible=false;h.frontFacade.visible=false;h.interior.visible=true;}
const aspect=innerWidth/innerHeight;const camera=new THREE.OrthographicCamera(-42*aspect/2,42*aspect/2,21,-21,.1,200);camera.position.set(9,42,29);camera.lookAt(0,1.5,0);renderer.render(scene,camera);window.previewReady=true;
</script></body></html>
